<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI PROJECT</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="../static/assets/css/style.css">
</head>
<body>
    <section class="get-started">
        <div class="container">
            <h2 class="heading">Get <span>Started</span></h2>
            <h2 class="sub-heading">Choose a file and click upload</h2>
            <form id="uploadForm" method="post" action="/upload" enctype="multipart/form-data">
                <div class="form-group">
                    <input type="file" class="form-control" name="file" id="file" required>
                </div>
                <button type="submit" class="btn btn-primary">Upload</button>
            </form>
            <div id="loading">Processing your video, please wait...</div>
            <div id="videoContainer">
                <a href="#" id="downloadLink" class="btn btn-success">Download Processed Video</a>
            </div>
        </div>
    </section>

    <section class="team" id="team">
        <h2 class="heading">Tech <span>Team</span></h2>
        <div class="members">
            <div class="team-mem">
                <img src="../static/assets/image/elaf.jpg" alt="">
                <h4>Al Hadi Elaf</h4>
            </div>
            <div class="team-mem">
                <img src="../static/assets/image/ariyan.jpg" alt="">
                <h4>Ismail Ariyan</h4>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="footer-text">
            <p>Copyright &copy; 2024 by Ariyan & Elaf</p>
        </div>
    </footer>

    <script src="https://unpkg.com/scrollreveal"></script>
    <script src="https://unpkg.com/typed.js@2.1.0/dist/typed.umd.js"></script>
    <script src="../static/assets/js/particles.js"></script>
    <script src="../static/assets/js/app.js"></script>
    <script src="../static/assets/js/javascript.js"></script>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', function(event) {
            event.preventDefault();
            document.getElementById('loading').style.display = 'block';
            var formData = new FormData(this);
            fetch('/upload', {
                method: 'POST',
                body: formData
            }).then(response => response.json())
            .then(data => {
                console.log(data); // Debugging line to check the response data
                document.getElementById('loading').style.display = 'none';
                if (data.filename) {
                    var downloadLink = document.getElementById('downloadLink');
                    downloadLink.href = `/download/${data.filename}`;
                    downloadLink.style.display = 'block';
                }
            }).catch(error => {
                console.error('Error:', error); // Debugging line to check for errors
                document.getElementById('loading').style.display = 'none';
            });
        });

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('downloadLink').style.display = 'none';
        });
    </script>
</body>
</html>
